[package]
name = "stock-analyzer"
version = "0.1.0"
description = "米国株＆グローバル株 AI分析デスクトップアプリ"
authors = ["Mitsu2"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2.0 はモバイル対応のため lib + 薄い main.rs という構成をとる
name = "stock_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"

# 分析結果の永続化。bundled で SQLite 本体を同梱し、実行環境への依存をなくす
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time"] }

# CORS を迂回し、SEC が要求する User-Agent を設定するため
# HTTP は必ず Rust 側から発行する
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "cookies",
  "gzip",
  "rustls-tls",
] }

[dev-dependencies]
# 非同期のコマンド層をテストするため（本体には不要）
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
