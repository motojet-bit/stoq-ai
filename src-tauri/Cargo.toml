[package]
name = "stock-analyzer"
version = "0.1.0"
description = "米国株＆グローバル株 AI分析デスクトップアプリ"
authors = ["Mitsu2"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2.0 はモバイル対応のため lib + 薄い main.rs という構成をとる
name = "stock_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
